name: brandify
description: Turn an unbranded Flutter app into a branded store presence. Real simulator/emulator screenshots, app rename, launcher icons and fastlane store metadata.
version: 0.3.0
repository: https://github.com/ryanhz/brandify
issue_tracker: https://github.com/ryanhz/brandify/issues
topics: [screenshots, app-store, google-play, fastlane, integration-test]
environment:
  sdk: ^3.6.0
resolution: workspace

executables:
  brandify: brandify

dependencies:
  args: ^2.7.0
  crypto: ^3.0.6
  image: ^4.8.0
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
