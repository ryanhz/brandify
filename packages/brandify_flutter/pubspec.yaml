version: 0.0.1
repository: https://github.com/TODO/brandify
environment:
  sdk: ^3.9.0
  flutter: ">=3.35.3"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
